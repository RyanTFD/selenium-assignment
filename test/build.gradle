apply plugin: 'java'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.seleniumhq.selenium:selenium-java:3.141.59'
    testImplementation 'org.testng:testng:6.14.3'
    testImplementation "org.slf4j:slf4j-simple:1.7.9"
}

test {
    useTestNG()
    testLogging.showStandardStreams = true
}